<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bioluminescent Nexus | Soil Health Monitor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #101319; color: #e1e2eb; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar */
  aside { width: 240px; min-width: 240px; background: #191c22; display: flex; flex-direction: column; padding: 24px 0; border-right: 1px solid rgba(255,255,255,0.05); }
  .logo { padding: 0 20px 32px; font-size: 16px; font-weight: 700; color: #78dc77; letter-spacing: -0.3px; }
  .logo small { display: block; font-size: 9px; font-weight: 400; color: #4a5568; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
  nav a { display: flex; align-items: center; gap: 12px; padding: 10px 16px; color: #6b7280; text-decoration: none; font-size: 13px; font-weight: 500; border-left: 2px solid transparent; transition: all 0.15s; cursor: pointer; }
  nav a:hover { color: #e1e2eb; background: rgba(255,255,255,0.03); }
  nav a.active { color: #78dc77; background: rgba(120,220,119,0.08); border-left-color: #78dc77; font-weight: 600; }
  nav a svg { width: 18px; height: 18px; opacity: 0.7; flex-shrink: 0; }
  nav a.active svg { opacity: 1; }

  /* Main */
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  header { background: rgba(16,19,25,0.95); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 0 32px; height: 64px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  header h1 { font-size: 18px; font-weight: 800; background: linear-gradient(90deg, #78dc77, #4caf50); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; text-transform: uppercase; }
  .badge { background: rgba(255,180,171,0.15); color: #ffb4ab; border: 1px solid rgba(255,180,171,0.3); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }

  /* Content */
  #content { flex: 1; overflow-y: auto; padding: 32px; }
  .page-title { margin-bottom: 28px; }
  .page-title h2 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  .page-title p { color: #6b7280; font-size: 13px; }

  /* Cards */
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .card { background: #1d2026; border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); }
  .card.alert { border-left: 3px solid #ffb4ab; }
  .card-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #6b7280; margin-bottom: 10px; }
  .card-value { font-size: 32px; font-weight: 700; line-height: 1; }
  .card-unit { font-size: 14px; font-weight: 400; color: #6b7280; margin-left: 2px; }
  .green { color: #78dc77; }
  .blue { color: #bdc2ff; }
  .red { color: #ffb4ab; }

  /* Panels */
  .panel { background: rgba(50,53,60,0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
  .panel h3 { font-size: 15px; font-weight: 600; margin-bottom: 20px; }
  .panel.split { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

  /* Chart area */
  .chart-area { width: 100%; }
  .chart-area svg { width: 100%; overflow: visible; }

  /* Table */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { padding: 10px 16px; text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #6b7280; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02); }
  td { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .pill { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }
  .pill.critical { background: rgba(255,180,171,0.12); color: #ffb4ab; }
  .pill.ok { background: rgba(120,220,119,0.12); color: #78dc77; }
  .pill.warn { background: rgba(255,193,7,0.12); color: #ffc107; }

  /* Heatmap colours */
  .hm-grid { display: grid; grid-template-columns: 60px repeat(4, 1fr); gap: 3px; font-size: 11px; }
  .hm-cell { height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-weight: 600; font-size: 12px; }
  .hm-label { height: 44px; display: flex; align-items: center; color: #6b7280; font-size: 11px; }

  /* Insight box */
  .insight-box { background: #1d2026; border-left: 3px solid #78dc77; border-radius: 8px; padding: 20px; }
  .insight-box h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #78dc77; margin-bottom: 16px; }
  .insight-box li { list-style: none; color: #9ca3af; font-size: 13px; margin-bottom: 12px; padding-left: 16px; position: relative; line-height: 1.5; }
  .insight-box li::before { content: ''; width: 6px; height: 6px; background: #78dc77; border-radius: 50%; position: absolute; left: 0; top: 6px; }
</style>
</head>
<body>
<aside>
  <div class="logo">Bioluminescent Nexus<small>Agricultural Intelligence</small></div>
  <nav id="nav">
    <a href="#" class="active" onclick="switchTab('overview',this);return false;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Overview
    </a>
    <a href="#" onclick="switchTab('trends',this);return false;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Trends
    </a>
    <a href="#" onclick="switchTab('rainfall',this);return false;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="19" x2="8" y2="21"/><line x1="8" y1="13" x2="8" y2="15"/><line x1="16" y1="19" x2="16" y2="21"/><line x1="16" y1="13" x2="16" y2="15"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="12" y1="15" x2="12" y2="17"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>
      Rainfall &amp; Irrigation
    </a>
    <a href="#" onclick="switchTab('anomaly',this);return false;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Anomaly Detection
    </a>
    <a href="#" onclick="switchTab('correlations',this);return false;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      Correlations
    </a>
  </nav>
</aside>
<main>
  <header>
    <h1>Soil Health Monitor</h1>
    <span class="badge">⚠ 2 Anomalies</span>
  </header>
  <div id="content"></div>
</main>

<script>
var tabs = {
  overview: function() {
    return `
    <div class="page-title">
      <h2>Sector Alpha-7 Overview</h2>
      <p>Live sensor telemetry — Updated just now</p>
    </div>
    <div class="cards">
      <div class="card"><div class="card-label">Soil Moisture</div><div class="card-value green">24.8<span class="card-unit">%</span></div></div>
      <div class="card"><div class="card-label">Soil Temperature</div><div class="card-value blue">32.5<span class="card-unit">°C</span></div></div>
      <div class="card"><div class="card-label">Soil pH</div><div class="card-value" style="color:#e1e2eb">6.8<span class="card-unit"> pH</span></div></div>
      <div class="card alert"><div class="card-label red">Active Alerts</div><div class="card-value red">02</div></div>
    </div>
    <div class="panel">
      <h3>Soil Moisture Trend (Last 24hr)</h3>
      <div class="chart-area">${lineChart()}</div>
    </div>`;
  },
  trends: function() {
    return `
    <div class="page-title">
      <h2>Historical Trends</h2>
      <p>Long-term sensor analysis across all parameters</p>
    </div>
    <div class="panel">
      <h3>Soil Moisture &amp; Temperature Correlation</h3>
      <div class="chart-area">${lineChart(true)}</div>
    </div>
    <div class="panel split">
      <div><h3>pH Stability</h3>${miniBar([6.8,6.9,7.0,6.7,6.6,6.8,7.1],'#78dc77')}</div>
      <div><h3>EC (dS/m)</h3>${miniBar([1.2,1.4,1.1,1.3,1.5,1.2,1.0],'#bdc2ff')}</div>
    </div>`;
  },
  rainfall: function() {
    return `
    <div class="page-title">
      <h2>Rainfall &amp; Irrigation</h2>
      <p>Water balance monitoring and hydrological planning</p>
    </div>
    <div class="cards" style="grid-template-columns:repeat(3,1fr)">
      <div class="card"><div class="card-label">Total Rainfall</div><div class="card-value green">124.5<span class="card-unit"> mm</span></div></div>
      <div class="card"><div class="card-label">Total Irrigation</div><div class="card-value blue">82.0<span class="card-unit"> mm</span></div></div>
      <div class="card"><div class="card-label">Water Stress Index</div><div class="card-value" style="color:#ffc107">0.32</div></div>
    </div>
    <div class="panel">
      <h3>Daily Water Balance (mm)</h3>
      <div class="chart-area">${barChart()}</div>
    </div>`;
  },
  anomaly: function() {
    return `
    <div class="page-title">
      <h2>Anomaly Detection</h2>
      <p>Automatic flagging of out-of-range sensor readings</p>
    </div>
    <div class="panel">
      <h3>Moisture Anomaly Scatter</h3>
      <div class="chart-area">${scatterChart()}</div>
    </div>
    <div class="panel">
      <h3>Flagged Events</h3>
      <table>
        <thead><tr><th>Timestamp</th><th>Plot</th><th>Sensor</th><th>Value</th><th>Status</th></tr></thead>
        <tbody>
          <tr><td>14:22 Today</td><td>Plot B-12</td><td>Temperature</td><td class="red" style="font-weight:600">38.2°C</td><td><span class="pill critical">CRITICAL</span></td></tr>
          <tr><td>12:10 Today</td><td>Plot A-01</td><td>Moisture</td><td class="red" style="font-weight:600">9.4%</td><td><span class="pill critical">CRITICAL</span></td></tr>
          <tr><td>09:05 Today</td><td>Plot D-04</td><td>Moisture</td><td style="color:#ffc107;font-weight:600">14.8%</td><td><span class="pill warn">WARNING</span></td></tr>
          <tr><td>Yesterday</td><td>Plot A-01</td><td>pH</td><td class="green" style="font-weight:600">7.2</td><td><span class="pill ok">RESOLVED</span></td></tr>
        </tbody>
      </table>
    </div>`;
  },
  correlations: function() {
    return `
    <div class="page-title">
      <h2>Sensor Correlations &amp; Insights</h2>
      <p>Pearson correlation matrix across soil health parameters</p>
    </div>
    <div style="display:grid;grid-template-columns:1fr 280px;gap:20px">
      <div class="panel">
        <h3>Correlation Matrix</h3>
        ${heatmap()}
      </div>
      <div class="insight-box">
        <h4>Neural Insights</h4>
        <ul>
          <li>Strong positive correlation (0.82) between soil moisture and pH stability over 7-day cycles.</li>
          <li>Temperature peaks show a moderate negative correlation (−0.43) with moisture retention.</li>
          <li>Irrigation events correlate (0.65) with a rise in electrical conductivity (EC) within 6 hours.</li>
          <li>Optimal growth window identified: moisture 20–30% with pH 6.5–7.0.</li>
        </ul>
      </div>
    </div>`;
  }
};

function lineChart(dual) {
  var pts = [22,24,23,25,26,24,27,25,24,23,25,26,24,25,27,26,24,23,25,24,23,24,25,26];
  var tmp = [28,29,30,31,32,31,30,29,28,29,30,31,32,33,32,31,30,29,30,31,32,31,30,29];
  var W=700, H=160, pad=40;
  var mx=Math.max.apply(null,pts), mn=Math.min.apply(null,pts);
  var sy=function(v){return H-pad-(v-mn)/(mx-mn+2)*(H-2*pad);};
  var sx=function(i){return pad+i*(W-2*pad)/(pts.length-1);};
  var path='M'; pts.forEach(function(v,i){path+=(i?'L':'')+sx(i)+','+sy(v)+' ';});
  var fill=path+'L'+sx(pts.length-1)+','+(H-pad)+' L'+pad+','+(H-pad)+' Z';
  var tpath=''; if(dual){tmp.forEach(function(v,i){var sy2=function(v){return H-pad-(v-24)/(40-24)*(H-2*pad);};tpath+=(i?'L':'M')+sx(i)+','+sy2(v)+' ';});}
  return '<svg viewBox="0 0 '+W+' '+H+'" style="height:'+H+'px"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#78dc77" stop-opacity="0.2"/><stop offset="100%" stop-color="#78dc77" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+fill+'" fill="url(#lg)"/>'
    +'<path d="'+path+'" fill="none" stroke="#78dc77" stroke-width="2.5" stroke-linejoin="round"/>'
    +(dual?'<path d="'+tpath+'" fill="none" stroke="#ffb1c7" stroke-width="2" stroke-dasharray="6,3"/>':'')
    +'<text x="10" y="14" font-size="10" fill="#4a5568">'+mx.toFixed(0)+'%</text>'
    +'<text x="10" y="'+(H-pad+4)+'" font-size="10" fill="#4a5568">'+mn.toFixed(0)+'%</text>'
    +(dual?'<text x="560" y="16" font-size="10" fill="#78dc77">● Moisture</text><text x="620" y="16" font-size="10" fill="#ffb1c7">— Temp</text>':'')
    +'</svg>';
}

function miniBar(vals,col) {
  var mx=Math.max.apply(null,vals), H=80, W=300;
  var days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var bars=''; vals.forEach(function(v,i){var x=i*(W/vals.length)+4,w=W/vals.length-8,h=(v/mx)*(H-20),y=H-h-4;bars+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="2" fill="'+col+'" opacity="0.8"/><text x="'+(x+w/2)+'" y="'+(H-2)+'" text-anchor="middle" font-size="9" fill="#4a5568">'+days[i]+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" style="height:'+H+'px">'+bars+'</svg>';
}

function barChart() {
  var rain=[12,5,0,8,22,10,4], irr=[0,10,15,0,5,0,12];
  var mx=25, H=180, W=700, pad=40;
  var days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var bars='';
  days.forEach(function(_,i){
    var bw=40, spacing=(W-2*pad)/days.length, x=pad+i*spacing;
    var rh=(rain[i]/mx)*(H-2*pad), ih=(irr[i]/mx)*(H-2*pad);
    bars+='<rect x="'+(x)+'" y="'+(H-pad-rh)+'" width="'+bw+'" height="'+rh+'" rx="2" fill="#78dc77" opacity="0.8"/>';
    bars+='<rect x="'+(x+bw+4)+'" y="'+(H-pad-ih)+'" width="'+bw+'" height="'+ih+'" rx="2" fill="#bdc2ff" opacity="0.8"/>';
    bars+='<text x="'+(x+bw)+'" y="'+(H-pad+14)+'" text-anchor="middle" font-size="10" fill="#6b7280">'+days[i]+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="height:'+H+'px"><line x1="'+pad+'" y1="'+(pad)+'" x2="'+pad+'" y2="'+(H-pad)+'" stroke="rgba(255,255,255,0.08)"/><line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="rgba(255,255,255,0.08)"/>'+bars+'<text x="'+pad+'" y="16" font-size="10" fill="#78dc77">● Rainfall</text><text x="120" y="16" font-size="10" fill="#bdc2ff">● Irrigation</text></svg>';
}

function scatterChart() {
  var W=700, H=160,pad=40;
  var pts=[22,24,23,25,26,24,27,25,24,23,25,26,24,25,27,26,24,23,25,24,23,24,25,26];
  var anom=[{i:3,v:35},{i:11,v:9},{i:18,v:38}];
  var anomIdx=[3,11,18];
  var mx=40,mn=5, sx=function(i){return pad+i*(W-2*pad)/(pts.length-1);},sy=function(v){return H-pad-(v-mn)/(mx-mn)*(H-2*pad);};
  var dots=''; pts.forEach(function(v,i){if(anomIdx.indexOf(i)<0){dots+='<circle cx="'+sx(i)+'" cy="'+sy(v)+'" r="4" fill="rgba(120,220,119,0.5)"/>';}});
  anom.forEach(function(a){dots+='<circle cx="'+sx(a.i)+'" cy="'+sy(a.v)+'" r="7" fill="rgba(255,180,171,0.2)" stroke="#ffb4ab" stroke-width="1.5"/><line x1="'+(sx(a.i)-5)+'" y1="'+(sy(a.v)-5)+'" x2="'+(sx(a.i)+5)+'" y2="'+(sy(a.v)+5)+'" stroke="#ffb4ab" stroke-width="2"/><line x1="'+(sx(a.i)+5)+'" y1="'+(sy(a.v)-5)+'" x2="'+(sx(a.i)-5)+'" y2="'+(sy(a.v)+5)+'" stroke="#ffb4ab" stroke-width="2"/>';});
  var thresh = sy(15);
  return '<svg viewBox="0 0 '+W+' '+H+'" style="height:'+H+'px"><line x1="'+pad+'" y1="'+thresh+'" x2="'+(W-pad)+'" y2="'+thresh+'" stroke="#ffb4ab" stroke-width="1" stroke-dasharray="6,3"/><text x="'+(W-pad-60)+'" y="'+(thresh-4)+'" font-size="10" fill="#ffb4ab">Min Threshold</text>'+dots+'<text x="10" y="14" font-size="10" fill="#4a5568">40%</text><text x="10" y="'+(H-pad)+'" font-size="10" fill="#4a5568">5%</text></svg>';
}

function heatmap() {
  var labels=['Moisture','Temp','pH','EC'];
  var vals=[[1.00,0.40,0.82,-0.15],[0.40,1.00,0.20,0.05],[0.82,0.20,1.00,-0.30],[-0.15,0.05,-0.30,1.00]];
  function color(v){if(v>=0.7)return'#78dc77';if(v>=0.4)return'#4a7c45';if(v>=-0.1)return'#272b33';if(v>=-0.4)return'#7c4a4a';return'#ffb4ab';}
  var html='<div class="hm-grid" style="margin-top:8px"><div></div>';
  labels.forEach(function(l){html+='<div style="color:#6b7280;font-size:11px;text-align:center;padding-bottom:4px">'+l+'</div>';});
  for(var i=0;i<4;i++){
    html+='<div class="hm-label">'+labels[i]+'</div>';
    for(var j=0;j<4;j++){
      var v=vals[i][j];
      html+='<div class="hm-cell" style="background:'+color(v)+';color:'+(Math.abs(v)>0.5?'#101319':'#e1e2eb')+'">'+v.toFixed(2)+'</div>';
    }
  }
  html+='</div>';
  return html;
}

function switchTab(name, el) {
  document.querySelectorAll('nav a').forEach(function(a){a.classList.remove('active');});
  el.classList.add('active');
  document.getElementById('content').innerHTML = tabs[name]();
}

// Init
document.getElementById('content').innerHTML = tabs.overview();
</script>
</body>
</html>
